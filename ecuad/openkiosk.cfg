// *IMPORTANT*  DO NOT REMOVE THIS LINE
// The first line of an autoconfig file is always skipped.

/**
 *  OpenKiosk autoconfig
 *
 *  Loaded because openkiosk/app/profile/openkiosk.js sets
 *  general.config.filename = openkiosk.cfg with obscure_value 0, so this file is
 *  read in plain text from Contents/Resources on every start. lockPref values
 *  cannot be changed from the UI or by a profile, and survive a profile reset.
 */

// WebAuthn off. The Firefox 115 ESR base has no macOS platform authenticator -- it can
// only reach a USB security key, which nobody at a kiosk carries -- so a passkey request on the
// kiosk can be neither satisfied nor declined, and kiosk mode hides the dialog carrying
// "Other ways to sign in". With WebAuthn unavailable, navigator.credentials offers no
// public-key support, the identity provider never puts the method forward, and sign-in falls
// back to Authenticator or password. Remove this once the base supports passkeys on
// macOS (Firefox 122 or later).
lockPref("security.webauth.webauthn", false);
lockPref("security.webauth.webauthn_enable_usbtoken", false);
